language:
  code: de
  name: Wikipedia
  local_name: Deutsch
  iso_code: de-DE
infrastructure:
  ports:
    http: 7475
    bolt: 7688
wikipedia:
  dbname: dewiki
  redirect_keywords:
  - '#WEITERLEITUNG'
  - '#REDIRECT'
  disambiguation_markers:
  - '{{Begriffsklärung}}'
  - '{{Begriffsklärungshinweis}}'
  stub_markers:
  - '{{Lückenhaft}}'
  - '{{Überarbeiten}}'
  namespace_prefixes:
    file: &id001
    - 'Datei:'
    - 'Bild:'
    - 'File:'
    - 'Image:'
    template:
    - 'Vorlage:'
    - 'Template:'
    category:
    - 'Kategorie:'
    - 'Category:'
text_processing:
  encoding: utf-8
  has_spaces: true
  word_separator: ' '
  stopwords_path: config/stopwords/de.txt
  stemmer: snowball
infobox:
  template_prefixes:
  - Infobox
  - Taxobox
  - Personendaten
  parameter_map:
    geboren: born
    gestorben: died
    lage: location
    fläche: area
    einwohner: population
ui:
  search_placeholder: Suche in der deutschen Wikipedia...
  language_name: Deutsch
  interface_translations:
    show_connections: Verbindungen anzeigen
    related_articles: Ähnliche Artikel
    categories: Kategorien
text_cleanup:
  file_patterns: *id001
